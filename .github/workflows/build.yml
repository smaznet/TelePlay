name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Tests never talk to Telegram, so placeholder credentials are enough here.
      - name: Placeholder Telegram credentials
        run: |
          echo "telegram.apiId=4" >> local.properties
          echo "telegram.apiHash=0123456789abcdef0123456789abcdef" >> local.properties
      - name: Unit tests (standard)
        run: ./gradlew :app:testStandardDebugUnitTest
      - name: Build F-Droid flavor
        run: ./gradlew :app:assembleFdroidRelease

  release:
    # Runs for version tags only (git tag v1.6 && git push --tags).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Telegram credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          echo "telegram.apiId=$TELEGRAM_API_ID" >> local.properties
          echo "telegram.apiHash=$TELEGRAM_API_HASH" >> local.properties
      - name: Build standard release
        run: ./gradlew :app:assembleStandardRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cd app/build/outputs/apk/standard/release
          "$BT/zipalign" -p -f 4 app-standard-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "TelePlay-${GITHUB_REF_NAME}.apk" aligned.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/standard/release/TelePlay-*.apk
          generate_release_notes: true
